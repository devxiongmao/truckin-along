version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: semiannually
    open-pull-requests-limit: 20
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: semiannually
    open-pull-requests-limit: 10
